<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>治療師排班表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: the paper calendar (Mon–Sat, one line per therapist per day) on the left; a sticky "剩餘時數" panel on the right. Big type, 34–44px rows. */
:root{
  --bg:#EDF1F4; --sheet:#FFFFFF; --sheet2:#F2F5F8; --ink:#101B26; --muted:#3B4855; --rule:#C6D0DA; --rule2:#8D9BA9;
  --accent:#1F4FB8; --accent-ink:#FFFFFF; --accent-soft:#DCE5F8;
  --ok:#17683A; --ok-soft:#DDF0E3; --warn:#7E4C00; --warn-soft:#FBEACB; --bad:#AE231C; --bad-soft:#FADDD9;
  --me:#6A2C9E; --me-soft:#F0E6FA;
  --e:#B25F00; --m:#0B7461; --l:#4B3BA6; --chip-ink:#FFFFFF;
  --hatch:rgba(16,27,38,.08);
  --shadow:0 1px 2px rgba(16,27,38,.08),0 8px 24px rgba(16,27,38,.10);
  --plb:37%;
  --fs:17px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1319; --sheet:#18212B; --sheet2:#202B37; --ink:#F2F6FA; --muted:#BAC6D2; --rule:#33414F; --rule2:#5D6D7E;
  --accent:#9DB8FF; --accent-ink:#0E1925; --accent-soft:#25355A;
  --ok:#7FD69E; --ok-soft:#173826; --warn:#F2C26B; --warn-soft:#3D2E10; --bad:#FF9A90; --bad-soft:#47201C;
  --me:#D5AEFF; --me-soft:#33224A;
  --e:#F0A84A; --m:#56CDB4; --l:#B3A8FF; --chip-ink:#0E1925;
  --hatch:rgba(255,255,255,.07); --plb:67%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1319; --sheet:#18212B; --sheet2:#202B37; --ink:#F2F6FA; --muted:#BAC6D2; --rule:#33414F; --rule2:#5D6D7E;
  --accent:#9DB8FF; --accent-ink:#0E1925; --accent-soft:#25355A;
  --ok:#7FD69E; --ok-soft:#173826; --warn:#F2C26B; --warn-soft:#3D2E10; --bad:#FF9A90; --bad-soft:#47201C;
  --me:#D5AEFF; --me-soft:#33224A;
  --e:#F0A84A; --m:#56CDB4; --l:#B3A8FF; --chip-ink:#0E1925;
  --hatch:rgba(255,255,255,.07); --plb:67%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }
html{font-size:var(--fs)}
html[data-fs="1"]{--fs:19px}
html[data-fs="2"]{--fs:21.5px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1{font-size:1.45rem;font-weight:900;letter-spacing:.04em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:48px;padding:.2rem 1.1rem;border:2px solid var(--rule2);background:var(--sheet);border-radius:12px;font-size:1.05rem;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fsgrp{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.grpseg button{min-height:48px;font-size:1.05rem;font-weight:900;padding:.2rem 1.1rem}
.grpseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hdr-r{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.seg{display:inline-flex;border:2px solid var(--rule2);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:.25rem .8rem;min-height:44px;font-weight:500}
.seg button+button{border-left:2px solid var(--rule2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:50px;padding:.35rem 1rem;border-radius:12px;border:2px solid var(--rule2);background:var(--sheet);font-weight:700;line-height:1.2;text-align:left}
.btn.sm{min-height:44px;padding:.25rem .75rem;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.me{background:var(--me);border-color:var(--me);color:var(--sheet)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .step{display:inline-grid;place-items:center;flex:0 0 auto;width:1.65em;height:1.65em;border-radius:50%;background:rgba(255,255,255,.25);font-size:.95em;font-weight:900}
.btn:not(.primary):not(.me) .step{background:var(--sheet2);border:2px solid var(--rule2)}
.btn small{display:block;font-weight:500;font-size:.78em;opacity:.92}
.mini{min-height:40px;padding:.15rem .65rem;border-radius:9px;border:2px solid var(--rule);background:var(--sheet2);font-size:.88rem;font-weight:700}

/* schedule layout */
.sched{display:grid;grid-template-columns:minmax(0,1fr) 23rem;gap:16px;align-items:start;margin-top:12px}
.calcol{min-width:0;display:flex;flex-direction:column;gap:10px}
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthbar h2{font-size:1.75rem;font-weight:900;letter-spacing:.03em;min-width:7.5em;text-align:center}
.monthbar h2 small{font-size:.5em;font-weight:500;color:var(--muted);margin-left:.4em}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .sp{flex:1 1 0}
.note{padding:10px 14px;border-radius:12px;border:2px dashed var(--accent);background:var(--accent-soft);font-size:.95rem}
.brushbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.brushbar b{font-size:1.1rem}
.brushbar .btn{margin-left:auto;background:var(--bg);color:var(--ink);border-color:var(--bg);min-height:44px}
.brushbar .ov{font-size:1rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 3.6rem;gap:6px}
.cal.with-sun{grid-template-columns:repeat(7,minmax(0,1fr))}
.wdh.sun{color:var(--bad)}
.sunc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border:1.5px dashed var(--rule);border-radius:10px;color:var(--muted);min-width:0}
.sunc .dnum{font-size:1.05rem}
.sunc .mini{min-height:38px;padding:.1rem .35rem;font-size:.8rem}
.cal.with-sun .sunc{justify-content:flex-start}
.day.sunday{border-color:var(--bad)}
.day.sunday .dwd{color:var(--bad)}
.wdh{font-weight:700;text-align:center;color:var(--muted);font-size:.95rem}
.wdh.sat{color:var(--accent)}
.day{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;min-width:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.day.today{border:2.5px solid var(--accent)}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:2px 4px 2px 2px;border-bottom:1px solid var(--rule)}
.dbtn{display:flex;align-items:baseline;gap:5px;border:0;background:none;min-height:36px;padding:0 6px;border-radius:7px}
.dbtn:hover{background:var(--sheet2)}
.dnum{font-size:1.2rem;font-weight:900}
.dwd{font-size:.82rem;font-weight:700;color:var(--muted)}
.day.sat .dwd{color:var(--accent)}
.cv{margin-left:auto;font-size:.78rem;font-weight:900;padding:.05em .45em;border-radius:6px;white-space:nowrap}
.cv.ok{color:var(--ok)}
.cv.bad{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
.cv.over{background:var(--warn-soft);color:var(--warn);border:1.5px solid var(--warn)}
.cv+.cv{margin-left:3px}
.lines{display:flex;flex-direction:column;gap:1px;padding:3px}
.ln{display:flex;align-items:center;gap:5px;min-height:1.95rem;width:100%;border:0;border-radius:6px;background:none;padding:1px 4px;text-align:left;cursor:pointer;touch-action:pan-y}
.ln:hover{background:var(--sheet2)}
.cd{flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:6px;background:var(--pc,var(--ink));color:var(--chip-ink);font-weight:900;display:grid;place-items:center;font-size:.86rem}
.nm{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.ov{margin-left:auto;flex:0 0 auto;font-weight:900;font-size:.95rem;padding:0 .42em;border-radius:6px;color:var(--chip-ink);line-height:1.6;white-space:nowrap}
.ov.none{color:var(--rule2);font-weight:500}
.ov.x{background:var(--sheet2);color:var(--muted);border:1.5px solid var(--rule)}
.c-E{background:var(--e)} .c-M{background:var(--m)} .c-L{background:var(--l)}
.c-EM{background:linear-gradient(90deg,var(--e) 50%,var(--m) 50%)}
.c-EL{background:linear-gradient(90deg,var(--e) 50%,var(--l) 50%)}
.c-ML{background:linear-gradient(90deg,var(--m) 50%,var(--l) 50%)}
.c-EML{background:linear-gradient(90deg,var(--e) 33.3%,var(--m) 33.3% 66.6%,var(--l) 66.6%)}
.c-{background:var(--rule2)}
.ln.bad .ov{outline:2.5px solid var(--bad);outline-offset:1px}
.ln .warn{color:var(--bad);font-weight:900;font-size:.85rem}
.day.hol{background:var(--sheet2)}
.holb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 6px;text-align:center}
.holb b{font-size:1.05rem;color:var(--bad)}
.holb span{font-size:.85rem;color:var(--muted);font-weight:700}
/* brush mode */
body.brushing .day:not(.hol){cursor:copy}
body.brushing .day:not(.hol):hover{border-color:var(--ink)}
.ln.dim{opacity:.42}
.ln.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ln.sel.b-p{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.ln.sel.b-a{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
.ln.sel.b-x{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 5px,var(--sheet) 5px 10px);box-shadow:inset 0 0 0 2px var(--bad)}
.ptg{font-size:.7rem;font-weight:900;padding:0 .3em;border-radius:4px;flex:0 0 auto}
.ptg.p{color:var(--ok)} .ptg.a{color:var(--warn)} .ptg.x{color:var(--bad)}
.day.drop-ok{outline:4px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}

/* panel */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border:2px solid var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:1.2rem;font-weight:900}
.pn-sum{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:2px solid var(--rule)}
.pn-base{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.pn-base b{font-size:1.5rem;font-weight:900}
.pn-gap{font-weight:700}
.pn-gap.bad{color:var(--bad)} .pn-gap.ok{color:var(--ok)} .pn-gap.warn{color:var(--warn)}
.hint{font-size:.86rem;color:var(--muted);margin:0}
.pcard{display:block;width:100%;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:12px;padding:9px 11px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.pcard:hover{border-color:var(--rule2)}
.pcard.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.pcard.me{border-color:var(--me);background:var(--me-soft)}
.pc-top{display:flex;align-items:center;gap:8px}
.pc-top b{font-size:1.12rem}
.pc-top .pill{margin-left:auto}
.pc-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:4px}
.pc-h .big{font-size:1.5rem;font-weight:900;line-height:1.1}
.pc-h .split{font-size:.85rem;color:var(--muted);font-weight:700}
.pc-g{font-weight:700;font-size:.95rem}
.pc-g.bad{color:var(--bad)} .pc-g.warn{color:var(--warn)} .pc-g.ok{color:var(--ok)} .pc-g.me{color:var(--me)} .pc-g.none{color:var(--muted)}
.meter{position:relative;height:12px;border-radius:6px;background:var(--sheet2);border:1.5px solid var(--rule2);margin:7px 0 3px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--pc,var(--accent))}
.meter .tick{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px}
.meter .tick.t{background:var(--ok)} .meter .tick.mx{background:var(--bad)}
.pc-meta{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.3em;padding:.08em .6em;border-radius:999px;font-size:.82rem;font-weight:900;border:2px solid transparent;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.me{background:var(--me-soft);color:var(--me);border-color:var(--me)}
.pill.none{background:var(--sheet2);color:var(--muted);border-color:var(--rule2)}
.palette{border:2px solid var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sheet2);margin-top:-4px}
.palette .pt{font-weight:900}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:52px;border:2px solid var(--rule2);background:var(--sheet);border-radius:10px;padding:5px 8px;text-align:left}
.pb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.pb .ov{margin-left:0}
.pb small{font-size:.74rem;color:var(--muted);line-height:1.2}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.86rem;border-top:2px solid var(--rule);padding-top:10px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .ov{margin-left:0;min-width:2.8em;text-align:center}

/* advanced layer: who works each fixed time slot */
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.viewbar .seg button{min-height:46px;font-weight:700;padding:.2rem 1rem}
.viewbar .seg button[data-v="slot"][aria-pressed="true"]{background:var(--me);color:var(--sheet)}
.slots{display:flex;flex-direction:column;gap:2px;padding:3px}
.srow{position:relative;display:flex;align-items:center;gap:4px;min-height:2.25rem;padding:2px 4px 2px 6px;border-radius:6px;border-left:5px solid var(--c);cursor:pointer;touch-action:pan-y}
.srow.k-E{--c:var(--e)} .srow.k-M{--c:var(--m)} .srow.k-L{--c:var(--l)}
.srow:hover{background:var(--sheet2)}
.srow.unp{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px)}
.srow.short{background-color:var(--bad-soft)}
.srow.over{background-color:var(--warn-soft)}
.sk{flex:0 0 auto;font-weight:900;color:var(--c);font-size:.95rem;width:1.1em}
.who{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:3px}
.sch{display:inline-flex;align-items:center;gap:3px;border-radius:6px;background:var(--pc,var(--ink));color:var(--chip-ink);font-size:.82rem;font-weight:900;padding:0 .35em;line-height:1.55;cursor:grab;user-select:none;-webkit-user-select:none}
.sch i{font-style:normal;font-weight:700}
.sch.me{box-shadow:inset 0 0 0 2px var(--me-soft)}
.sch.bad{outline:2.5px solid var(--bad);outline-offset:1px}
.sc{flex:0 0 auto;font-size:.76rem;font-weight:900;color:var(--ok)}
.srow.short .sc{color:var(--bad)} .sc .extra{color:var(--muted);font-weight:700} .srow.over .sc{color:var(--warn)}
.srow .bt{position:absolute;right:3px;top:-6px;font-size:.66rem;font-weight:900;padding:0 .3em;border-radius:4px;background:var(--ink);color:var(--bg)}
body.brushing .srow{cursor:copy}
.srow.b-on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.srow.b-p{box-shadow:inset 0 0 0 2.5px var(--ok)} .srow.b-a{box-shadow:inset 0 0 0 2.5px var(--warn)} .srow.b-x{opacity:.55}
.srow.b-on.b-p,.srow.b-on.b-a{box-shadow:inset 0 0 0 3px var(--ink)}
.srow.drop-ok{outline:3px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
@media (max-width:1250px){.sch i{display:none}}
@media (pointer:coarse){.srow{min-height:2.7rem}}
/* candidates */
.msheet.wide{width:min(46rem,100%)}
.grp-h{font-weight:900;font-size:.95rem;margin-top:2px;display:flex;align-items:center;gap:8px}
.grp-h.ok{color:var(--ok)} .grp-h.warn{color:var(--warn)} .grp-h.no{color:var(--muted)} .grp-h.me{color:var(--me)} .grp-h.on{color:var(--ink)}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;width:100%;min-height:58px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:12px;padding:8px 12px}
.cand:hover:not(:disabled){border-color:var(--ink)}
.cand.ok{border-color:var(--ok)} .cand.top{box-shadow:0 0 0 3px var(--ok)}
.cand.warn{border-color:var(--warn)} .cand.me{border-color:var(--me);background:var(--me-soft)}
.cand.on{background:var(--sheet2);border-color:var(--ink)}
.cand:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
.cand .cn b{font-size:1.06rem}
.cand .cn small{display:block;font-size:.84rem;color:var(--muted);line-height:1.35}
.cand .ch{text-align:right;font-weight:900;font-size:1.02rem;white-space:nowrap}
.cand .ch small{display:block;font-size:.75rem;font-weight:700;color:var(--muted)}
.cand .act{font-size:.8rem;font-weight:900;padding:.1em .5em;border-radius:6px;background:var(--ink);color:var(--bg)}
.star{font-size:.76rem;font-weight:900;color:var(--sheet);background:var(--ok);border-radius:5px;padding:0 .4em;margin-left:6px}
.need{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* day timeline */
.tl{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.tl-row{display:grid;grid-template-columns:8.5rem minmax(18rem,1fr);gap:8px;align-items:center;min-height:2.3rem}
.tl-name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;min-width:0}
.tl-name small{color:var(--muted);font-weight:500;font-size:.8rem}
.tl-track{position:relative;height:1.75rem;border-radius:6px;background:var(--sheet2);background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px calc(100%/14))}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--rule2);color:var(--chip-ink);font-size:.72rem;font-weight:700;padding:0 5px;white-space:nowrap;overflow:hidden;display:flex;align-items:center}
.tl-bar.c-E{background:var(--e)} .tl-bar.c-M{background:var(--m)} .tl-bar.c-L{background:var(--l)}
.tl-bar.c-EM{background:linear-gradient(90deg,var(--e) 50%,var(--m) 50%)} .tl-bar.c-EL{background:linear-gradient(90deg,var(--e) 50%,var(--l) 50%)}

<script>
/*CORE-START*/
const SL=['E','M','L'];
function monthDates(ym,sun){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();const out=[];
  for(let d=1;d<=n;d++){const wd=new Date(y,m-1,d).getDay();const key=ym+'-'+String(d).padStart(2,'0');if(wd===0&&!(sun&&sun.includes(key)))continue;out.push({key,d,m,wd})}return out}
function shiftYm(ym,k){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function sortCov(s){return SL.filter(c=>s.includes(c)).join('')}
function optById(cfg,id){return (cfg.opts||[]).find(o=>o.id===id)||null}
function covOfV(cfg,v){if(!v||v==='X')return '';const o=optById(cfg,v);return o?o.cov:''}
function hOfV(cfg,v){if(!v||v==='X')return 0;const o=optById(cfg,v);return o?(+o.h||0):0}
function optForCov(cfg,cov){if(!cov)return null;return (cfg.opts||[]).find(o=>o.cov===cov)||null}
function prefOf(p,wd,c){return (p&&p.pref&&p.pref[wd+c])||''}
function baseHours(month,dates){if(month.base>0)return month.base;const hol=month.hol||{};return dates.filter(d=>d.wd>=1&&d.wd<=5&&!hol[d.key]).length*8}
function tally(cfg,staff,month,dates){
  const T={};staff.forEach(p=>T[p.id]={wk:0,sat:0,tot:0,days:0,unpop:0,bad:0});
  const cov={},short={E:0,M:0,L:0},over={E:0,M:0,L:0};let shortN=0,overN=0;const unpop=new Set(cfg.unpopular||[]);const hol=month.hol||{};
  for(const dt of dates){if(hol[dt.key])continue;const day=(month.e||{})[dt.key]||{};const c={E:0,M:0,L:0};
    for(const p of staff){const v=day[p.id];if(!v||v==='X')continue;const o=optById(cfg,v);if(!o)continue;const t=T[p.id];const h=+o.h||0;
      if(dt.wd===6||dt.wd===0)t.sat+=h;else t.wk+=h;t.tot+=h;t.days++;
      for(const s of o.cov){c[s]++;if(unpop.has(dt.wd+s))t.unpop++;if(prefOf(p,dt.wd,s)==='x')t.bad++}}
    cov[dt.key]=c;for(const s of SL){const nd=(cfg.need||{})[dt.wd+s]||0;const n=nd-c[s];const lim=Math.max(nd,cfg.maxOk||2);if(n>0){short[s]+=n;shortN+=n}else if(c[s]>lim){over[s]+=c[s]-lim;overN+=c[s]-lim}}}
  return {T,cov,short,shortN,over,overN};
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canAdd(cfg,p,e,st,dt,c,maxSlots,useCap){
  const v=(e[dt.key]||{})[p.id];if(v==='X')return null;
  const cur=covOfV(cfg,v);if(cur.includes(c))return null;
  if(prefOf(p,dt.wd,c)==='x')return null;
  const nc=sortCov(cur+c);if(nc.length>maxSlots)return null;
  const o=optForCov(cfg,nc);if(!o)return null;
  const delta=(+o.h||0)-hOfV(cfg,v);
  let cap=p.isMe?(p.maxH||p.targetH||0):(p.maxH||0);
  if(useCap&&p.capH>0)cap=cap?Math.min(cap,p.capH):p.capH;
  if(cap>0&&st[p.id]+delta>cap+1e-9)return null;
  return {o,delta};
}
/* onlyMe=false: fill open slots with everyone, each up to their usual hours (capH), preferring the slots they normally work (opt.habit);
   the scheduler takes part too but only up to her usual load. onlyMe=true: the scheduler covers whatever is still open. */
function autoFill(cfg,staff,month,dates,opt){
  const e=JSON.parse(JSON.stringify(month.e||{}));const hol=month.hol||{};const unpop=new Set(cfg.unpopular||[]);
  const tl=tally(cfg,staff,{e,hol},dates);const st={},up={};staff.forEach(p=>{st[p.id]=tl.T[p.id].tot;up[p.id]=tl.T[p.id].unpop});
  const people=staff.filter(p=>p.active!==false&&(opt.onlyMe?p.isMe:true));const hb=opt.habit||{};const useCap=!opt.onlyMe;if(!people.length)return {e,filled:0,left:tl.shortN,capped:false};
  const rnd=mulberry32(opt.seed||7);const maxS=p=>p.isMe?3:(cfg.maxPerDay||2);const slots=[];
  for(const dt of dates){if(hol[dt.key])continue;for(const c of SL){const open=((cfg.need||{})[dt.wd+c]||0)-tl.cov[dt.key][c];if(open>0)slots.push({dt,c,open,un:unpop.has(dt.wd+c),r:rnd()})}}
  if(opt.onlyMe){const me=people[0];const rk={p:0,'':1,a:2};slots.sort((x,y)=>((rk[prefOf(me,x.dt.wd,x.c)]??3)-(rk[prefOf(me,y.dt.wd,y.c)]??3))||(x.r-y.r))}
  else{slots.forEach(s=>s.k=people.filter(p=>canAdd(cfg,p,e,st,s.dt,s.c,maxS(p),useCap)).length);slots.sort((x,y)=>(x.k-y.k)||((y.un?1:0)-(x.un?1:0))||(x.r-y.r))}
  let filled=0,capped=false;
  for(const s of slots){for(let i=0;i<s.open;i++){
    let best=null,bs=-Infinity,bo=null;
    for(const p of people){const r=canAdd(cfg,p,e,st,s.dt,s.c,maxS(p),useCap);
      if(!r){if(p.isMe){const cap=p.maxH||p.targetH||0;if(cap>0&&st[p.id]>=cap-1e-9)capped=true}continue}
      let sc=0;const pr=prefOf(p,s.dt.wd,s.c);if(pr==='p')sc+=4;else if(pr==='a')sc-=7;
      const min=p.minH||0,tg=p.targetH||min;
      if(st[p.id]<min)sc+=10+(min-st[p.id])/Math.max(r.delta,1);
      if(tg>0){sc+=6*(tg-st[p.id])/tg;if(st[p.id]+r.delta>tg+1e-9)sc-=9}
      if(s.un)sc-=3*up[p.id];
      const hv=(hb[p.id]||{})[s.dt.wd+s.c]||0;sc+=8*hv;
      if(p.isMe&&!opt.onlyMe)sc-=3;
      sc-=0.15*r.delta;sc+=rnd()*0.6;
      if(sc>bs){bs=sc;best=p;bo=r}}
    if(!best)break;
    (e[s.dt.key]||(e[s.dt.key]={}))[best.id]=bo.o.id;st[best.id]+=bo.delta;if(s.un)up[best.id]++;filled++;}}
  const after=tally(cfg,staff,{e,hol},dates);
  return {e,filled,left:after.shortN,capped};
}
/* Same weekday, last month. A person who always does the same thing on that weekday keeps it on every such day this month.
   A weekday that rotates (e.g. Saturdays shared in turns) is copied in order: 1st Saturday from last month's 1st, 2nd from 2nd, wrapping around. Only empty days are filled. */
function copyPattern(staff,prev,prevDates,month,dates,cfg){
  const e=JSON.parse(JSON.stringify(month.e||{}));const hol=month.hol||{};const ph=prev.hol||{};let n=0;
  for(const p of staff){if(p.active===false)continue;for(let wd=1;wd<=6;wd++){
    const src=prevDates.filter(dt=>dt.wd===wd&&!ph[dt.key]).map(dt=>((prev.e||{})[dt.key]||{})[p.id]||'');
    if(!src.some(Boolean))continue;
    const vals=[...new Set(src.filter(Boolean))];const fixed=vals.length===1&&src.every(Boolean);
    const tgt=dates.filter(dt=>dt.wd===wd&&!hol[dt.key]);
    tgt.forEach((dt,i)=>{const day=e[dt.key]||(e[dt.key]={});if(day[p.id])return;const v=fixed?vals[0]:src[i%src.length];if(!v){if(!Object.keys(day).length)delete e[dt.key];return}
      if(cfg&&v!=='X'){const c=covOfV(cfg,v);if(c){const cnt={E:0,M:0,L:0};for(const id in day)for(const k of covOfV(cfg,day[id]))cnt[k]++;
        if([...c].every(k=>cnt[k]>=((cfg.need||{})[dt.wd+k]||0))){if(!Object.keys(day).length)delete e[dt.key];return}}}
      day[p.id]=v;n++})}}
  return {e,n};
}
/* Search-based fill: tries many complete arrangements and keeps the one with the lowest total cost.
   Only empty cells are filled (or an existing shift is extended); nothing the user entered is removed.
   staff fields used: id, isMe, emp, active, pref, minH, targetH, maxH (hard), capH (usual max), usual (scheduler's usual hours). */
const FILL_W={short:1000,over:250,min:40,below:6,above:9,cap:30,hard:500,meAbove:12,meBelow:3,split:{EL:90,EML:140,EM:35},solo:{M:6,L:10},prefA:25,prefP:-6,habit:-14,unpop:3,wk:5,soft:60};
function optimizeFill(cfg,staff,month,dates,opt){
  opt=opt||{};const W=FILL_W;const hol=month.hol||{};const e=JSON.parse(JSON.stringify(month.e||{}));
  const act=staff.filter(p=>p.active!==false&&(!opt.onlyMe||p.isMe));const unpop=new Set(cfg.unpopular||[]);const hb=opt.habit||{};
  const ds=dates.filter(d=>!hol[d.key]);const need=ds.map(d=>SL.map(k=>(cfg.need||{})[d.wd+k]||0));
  const cov=ds.map(()=>[0,0,0]);const H={},U={},WK={};staff.forEach(p=>{H[p.id]=0;U[p.id]=0;WK[p.id]=0});const isWk=d=>d.wd===6||d.wd===0;

function covName(c){return c.split('').map(x=>SLN[x]).join('')}
function evalCand(p,dt,k,T){
  const q=eff(p);const v=getE(dt.key,p.id),cur=covOfV(S.cfg,v),t=T[p.id].tot;const r={p,q,v,cur,t,on:cur.includes(k),why:[],level:'ok',score:0,after:t};
  if(r.on){const nc=cur.replace(k,'');const o=nc?optForCov(S.cfg,nc):null;r.after=t-hOfV(S.cfg,v)+(o?+o.h:0);r.why.push(nc?`移除後剩「${o?o.label:covName(nc)}」`:'移除後這天不上班');return r}
  if(v==='X'){r.level='no';r.why.push('這天休假');return r}
  const pr=prefOf(p,dt.wd,k);if(pr==='x'){r.level='no';r.why.push(`週${WDN[dt.wd]}${SLN[k]}班標示「不可」`);return r}
  const nc=sortCov(cur+k);const o=optForCov(S.cfg,nc);if(!o){r.level='no';r.why.push(`沒有「${covName(nc)}」這種班別`);return r}

  if(cap&&r.after>cap+1e-9){r.level='no';r.why.push(p.isMe&&!q.maxH?`會超過應上 ${fmtH(cap)} 小時`:`會超過上限 ${fmtH(cap)} 小時`);return r}
  if(cur)r.why.push(`當天已上${vLabel(v)}，會變成「${o.label}」`);
  if(!p.isMe&&(nc==='EL'||nc==='EML')){r.score-=12;r.level='warn';r.why.push('會變成早晚兩頭班，平常只有排班者這樣上')}
  if(!p.isMe&&nc.length>(S.cfg.maxPerDay||2)){r.level='warn';r.why.push(`一天會上 ${nc.length} 個時段`)}
  {const hv=(HB[p.id]||{})[dt.wd+k]||0;if(hv>=0.5){r.score+=8*hv;r.why.push(`平常週${WDN[dt.wd]}就常上${SLN[k]}班`)}}
  if(pr==='p'){r.score+=4;r.why.push('偏好這個時段')}else if(pr==='a'){r.score-=7;r.level='warn';r.why.push('標示「盡量不要」')}
  const min=q.minH||0,tg=q.targetH||min;
  if(min&&t<min){r.score+=10+(min-t)/Math.max(r.delta,1);r.why.push(`還差 ${fmtH(min-t)} 小時到最低`)}
  else if(tg&&t<tg){r.score+=6*(tg-t)/tg;r.why.push(`還差 ${fmtH(tg-t)} 小時到需求`)}
  else if(tg&&t>=tg){r.score-=9;if(r.level==='ok')r.level='warn';r.why.push('已達需求時數')}
  if((S.cfg.unpopular||[]).includes(dt.wd+k)){r.score-=3*T[p.id].unpop;r.why.push(`冷門時段，本月已上 ${T[p.id].unpop} 次`)}
  if(cur&&r.level!=='no')r.score+=0.5;
  if(p.isMe){r.score-=20;if(r.level==='ok')r.level='me';r.why.push('排班者，建議最後再補')}
  if(!r.why.length)r.why.push('可以排');
  return r;
}

function ranges(text){const out=[];const re=/(\d{1,2}):(\d{2})\s*[-–~]\s*(\d{1,2}):(\d{2})/g;let m;while((m=re.exec(text||''))){out.push([+m[1]*60+ +m[2],+m[3]*60+ +m[4]])}return out}

    if(e.pointerType==='mouse'){e.preventDefault();beginSweep(day.dataset.date,e);return}
    const c={kind:'sweep',date:day.dataset.date,x:e.clientX,y:e.clientY,pid:e.pointerId};
    c.timer=setTimeout(()=>{if(D.c===c){D.c=null;beginSweep(c.date,{pointerId:c.pid,clientX:c.x,clientY:c.y});vib()}},380);D.c=c;return}
  const src=e.target.closest('[data-drag]');if(!src||S.brush&&src.dataset.drag==='line')return;
  const c={kind:'drag',what:src.dataset.drag,sid:src.dataset.sid,date:src.dataset.date||null,k:src.dataset.k||null,x:e.clientX,y:e.clientY,type:e.pointerType,pid:e.pointerId};
  if(c.what==='line'&&!getE(c.date,c.sid))return;
  D.c=c;if(c.type!=='mouse')c.timer=setTimeout(()=>{if(D.c===c)startDrag()},380);
});
document.addEventListener('pointermove',e=>{
  D.cx=e.clientX;D.cy=e.clientY;
  if(D.sweep){if(e.pointerId===D.sweep.pid)sweepAt(e.clientX,e.clientY);return}
  if(D.drag){if(e.pointerId===D.c.pid)moveDrag(e.clientX,e.clientY);return}
  const c=D.c;if(!c||e.pointerId!==c.pid)return;const dd=Math.abs(e.clientX-c.x)+Math.abs(e.clientY-c.y);
  if(c.kind==='drag'&&c.type==='mouse'){if(dd>6)startDrag();return}
  if(dd>10)cancelC();
});
document.addEventListener('pointerup',e=>{if(D.sweep)endSweep();else if(D.drag)endDrag(true);else cancelC()});
document.addEventListener('pointercancel',()=>{if(D.sweep)endSweep();else if(D.drag)endDrag(false);else cancelC()});
document.addEventListener('touchmove',e=>{if(D.sweep||D.drag)e.preventDefault()},{passive:false});
function cancelC(){if(D.c){clearTimeout(D.c.timer);D.c=null}}
function edgeScroll(y){D.vy=y<70?-Math.ceil((70-y)/5):y>innerHeight-70?Math.ceil((y-(innerHeight-70))/5):0}
function loop(){if(!D.sweep&&!D.drag)return;if(D.vy){window.scrollBy(0,D.vy);if(D.sweep)sweepAt(D.cx,D.cy);else moveDrag(D.cx,D.cy)}D.raf=requestAnimationFrame(loop)}
function beginSweep(date,e){
  if(S.readonly)return;pushUndo();
  const slot=typeof date==='object';const mode=slot?slotToggle(S.brush.sid,date.date,date.k,undefined,{noUndo:true}):brushApply(date);
  if(slot&&!mode){S.undo.pop();return}
  D.sweep={mode,slot,visited:new Set([slot?date.date+date.k:date]),pid:e.pointerId,n:1};D.suppress=true;D.cx=e.clientX;D.cy=e.clientY;D.raf=requestAnimationFrame(loop)}
function sweepAt(x,y){const el=document.elementFromPoint(x,y);edgeScroll(y);
  if(D.sweep.slot){const row=el&&el.closest('.srow[data-date]');if(!row)return;const key=row.dataset.date+row.dataset.k;if(D.sweep.visited.has(key))return;D.sweep.visited.add(key);D.sweep.n++;slotToggle(S.brush.sid,row.dataset.date,row.dataset.k,D.sweep.mode,{noUndo:true,quiet:true});return}
  const day=el&&el.closest('.day[data-date]');
  if(!day||day.classList.contains('hol'))return;const d=day.dataset.date;if(D.sweep.visited.has(d))return;D.sweep.visited.add(d);D.sweep.n++;brushApply(d,D.sweep.mode)}
function endSweep(){const s=D.sweep;D.sweep=null;cancelAnimationFrame(D.raf);D.vy=0;setTimeout(()=>D.suppress=false,60);
  if(s&&s.n>1)toast(s.slot?(s.mode==='remove'?`已移出 ${s.n} 個時段`:`已加入 ${s.n} 個時段`):(s.mode==='clear'?`已取消 ${s.n} 天`:`已填入 ${s.n} 天`))}
function startDrag(){const c=D.c;clearTimeout(c.timer);const p=S.staff[c.sid];if(!p){cancelC();return}
  D.drag=true;document.body.classList.add('dragging');
  const v=c.what==='line'?getE(c.date,c.sid):(S.brush&&S.brush.sid===c.sid?S.brush.opt:defaultOpt(c.sid));c.v=v;c.slot=S.view==='slot';
  const g=$('#ghost');g.textContent=c.what==='chip'?`${p.code} ${p.name}・${SLN[c.k]}班（移動）`:c.slot?`${p.code} ${p.name}・拖到時段`:`${p.code} ${p.name}・${vLabel(v)}${c.what==='line'?'（複製）':''}`;g.style.setProperty('--pc',colorOf(p));g.hidden=false;
  vib();moveDrag(D.cx||c.x,D.cy||c.y);D.raf=requestAnimationFrame(loop)}
function moveDrag(x,y){const g=$('#ghost');g.style.transform=`translate(${x+14}px,${y-48}px)`;
  g.hidden=true;const el=document.elementFromPoint(x,y);g.hidden=false;
  let over=D.c&&D.c.slot?(el&&el.closest('.srow[data-date]')):(el&&el.closest('.day[data-date]'));if(over&&over.classList.contains('hol'))over=null;
  if(over!==D.over){if(D.over)D.over.classList.remove('drop-ok');D.over=over;if(over)over.classList.add('drop-ok')}edgeScroll(y)}
function endDrag(drop){const c=D.c,over=D.over;cancelAnimationFrame(D.raf);D.drag=false;D.c=null;D.over=null;D.vy=0;
  document.body.classList.remove('dragging');$('#ghost').hidden=true;if(over)over.classList.remove('drop-ok');
  D.suppress=true;setTimeout(()=>D.suppress=false,80);
  if(!drop||!over)return;
  if(c.slot){const to={date:over.dataset.date,k:over.dataset.k};if(c.what==='chip')slotMove(c.sid,{date:c.date,k:c.k},to);else if(slotToggle(c.sid,to.date,to.k,'add')){const dt=dtOf(to.date);if($('#toast').hidden||!/注意|盡量|沒有/.test($('#toast').textContent))toast(`已把 ${S.staff[c.sid].name} 排進 ${dt.m}/${dt.d} ${SLN[to.k]}班`)}return}
  if(!c.v)return;const date=over.dataset.date;if(c.what==='line'&&date===c.date)return;
  if(setEntry(date,c.sid,c.v)){const dt=dtOf(date);if(!$('#toast').hidden&&/注意|盡量/.test($('#toast').textContent))return;toast(`已把 ${S.staff[c.sid].name}「${vLabel(c.v)}」排到 ${dt.m}/${dt.d}，點一下可以改`)}}

addEventListener('pagehide',()=>{if(S.mode!=='local')return;for(const [path,p] of pending){clearTimeout(p.timer);if(p.dirty||p.busy)localWrite(path,p.val)}});
render();initStore();
})();
</script>
